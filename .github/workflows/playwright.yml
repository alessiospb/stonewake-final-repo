name: Playwright Tests

on:
  push:
    branches: [master, main]
    # Documentation-only commits do not start a run, so they do not replace the published series.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # On the job, not the workflow: a slow publish must not hold back the next run's tests.
    concurrency:
      group: playwright-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --retries=0
        env:
          STONEWAKE_EMAIL: ${{ secrets.STONEWAKE_EMAIL }}
          STONEWAKE_PASSWORD: ${{ secrets.STONEWAKE_PASSWORD }}
          STONEWAKE_API_KEY: ${{ secrets.STONEWAKE_API_KEY }}
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Publishes an index of every master run of this commit, each linked to its own HTML report.
  # The workflow result is still decided by the test job. Reports hold no traces.
  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Published through a branch: the github-pages environment left deployments waiting.
    permissions:
      actions: read
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # Missing when the test job failed before Playwright ran; the index still lists the run.
        continue-on-error: true
        with:
          name: playwright-report
          path: site/runs/${{ github.run_id }}
      - run: node scripts/build-pages-site.mjs site
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to the gh-pages branch
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish report index for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
